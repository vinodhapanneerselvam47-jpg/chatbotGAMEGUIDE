<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Guide AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --cabinet: #1a1330;
    --cabinet-dark: #110b22;
    --screen: #0d0a1a;
    --marquee: #ff4fa3;
    --cyan: #4fd8ff;
    --text: #eae6f5;
    --text-dim: #9c94b8;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(ellipse at top, #241a3f 0%, var(--cabinet) 55%, var(--cabinet-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
  }

  .cabinet {
    width: 100%;
    max-width: 720px;
    height: 88vh;
    max-height: 880px;
    display: flex;
    flex-direction: column;
    background: var(--cabinet);
    border-radius: 14px;
    padding: 14px 14px 18px;
    box-shadow:
      0 0 0 4px #2a1f4a,
      0 24px 50px rgba(0,0,0,0.55);
  }

  .marquee {
    flex-shrink: 0;
    text-align: center;
    padding: 14px 10px 16px;
    border-bottom: 2px solid rgba(255,79,163,0.35);
  }

  .marquee h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.1rem;
    letter-spacing: 1px;
    margin: 0 0 8px;
    color: var(--marquee);
    text-shadow: 0 0 10px rgba(255,79,163,0.55);
  }

  .marquee p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .screen {
    position: relative;
    flex: 1;
    margin-top: 14px;
    background: var(--screen);
    border-radius: 8px;
    border: 3px solid #2a1f4a;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 2px,
      transparent 4px
    );
  }

  #chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #chat-window::-webkit-scrollbar { width: 8px; }
  #chat-window::-webkit-scrollbar-thumb {
    background: rgba(234,230,245,0.15);
    border-radius: 4px;
  }

  .msg {
    max-width: 78%;
    padding: 11px 15px;
    line-height: 1.5;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: blink-in 0.18s ease-out;
  }

  @keyframes blink-in {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .tag {
    display: block;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .msg.bot {
    align-self: flex-start;
    background: rgba(255,79,163,0.08);
    border: 1.5px dashed var(--marquee);
    border-radius: 2px 12px 12px 12px;
    color: var(--text);
  }
  .msg.bot .tag { color: var(--marquee); }

  .msg.user {
    align-self: flex-end;
    background: rgba(79,216,255,0.08);
    border: 1.5px solid var(--cyan);
    border-radius: 12px 2px 12px 12px;
    color: var(--text);
  }
  .msg.user .tag { color: var(--cyan); text-align: right; }

  .msg.system {
    align-self: center;
    color: #ff8a8a;
    border: 1px dashed #ff8a8a;
    border-radius: 8px;
    font-size: 0.85rem;
  }

  .msg.thinking {
    align-self: flex-start;
    border: 1.5px dashed rgba(234,230,245,0.25);
    border-radius: 2px 12px 12px 12px;
    color: var(--text-dim);
    font-style: italic;
  }

  .controls {
    flex-shrink: 0;
    padding: 12px 16px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(0,0,0,0.2);
    border-top: 1px solid rgba(234,230,245,0.08);
  }

  #user-input {
    flex: 1;
    resize: none;
    border: 1px solid rgba(79,216,255,0.35);
    outline: none;
    border-radius: 6px;
    padding: 11px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    background: #150f28;
    color: var(--text);
    max-height: 100px;
  }

  #user-input::placeholder { color: var(--text-dim); }
  #user-input:focus { border-color: var(--cyan); }

  #send-btn {
    flex-shrink: 0;
    border: none;
    cursor: pointer;
    background: var(--marquee);
    color: #1a1330;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.5px;
    padding: 13px 18px;
    border-radius: 6px;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  #send-btn:hover { background: #ff77b8; }
  #send-btn:active { transform: scale(0.96); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 480px) {
    .cabinet { height: 92vh; border-radius: 10px; }
    .marquee h1 { font-size: 0.85rem; }
    .msg { max-width: 88%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="marquee">
    <h1>GAME GUIDE AI</h1>
    <p>Stuck on a level, a boss, or a build? Tell me the game and I'll help you clear it.</p>
  </div>

  <div class="screen">
    <div id="chat-window">
      <div class="msg bot"><span class="tag">GUIDE</span>Hey, I'm Game Guide AI. Tell me what game you're playing and where you're stuck, and I'll help you figure it out.</div>
    </div>

    <div class="controls">
      <textarea id="user-input" rows="1" placeholder="What game and what's the problem?"></textarea>
      <button id="send-btn">SEND</button>
    </div>
  </div>
</div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, role, tag) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (tag) {
      const tagEl = document.createElement('span');
      tagEl.className = 'tag';
      tagEl.textContent = tag;
      div.appendChild(tagEl);
    }
    div.appendChild(document.createTextNode(text));
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
  }

  userInput.addEventListener('input', autoResize);

  userInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user', 'PLAYER');
    userInput.value = '';
    autoResize();
    sendBtn.disabled = true;

    const thinkingEl = addMessage('Loading strategy...', 'thinking');

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      thinkingEl.remove();

      if (!response.ok) {
        addMessage(data.error || 'Something went wrong. Please try again.', 'system');
      } else {
        addMessage(data.reply, 'bot', 'GUIDE');
      }
    } catch (err) {
      thinkingEl.remove();
      addMessage('Could not reach the server. Please check your connection.', 'system');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>

</body>
</html>
